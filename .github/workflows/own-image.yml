name: own trial image

on:
  workflow_call:
    inputs:
      tool_only:
        description: App-only source with independently equal before/after own B derivations
        required: false
        type: boolean
        default: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    outputs:
      source: ${{ steps.source.outputs.sha }}
      drv: ${{ steps.source.outputs.drv }}
    steps:
      # Test the exact PR head, not the refs/pull/N/merge commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Record source commit and own-image drvPath
        id: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          drv="$(nix eval --raw .#own-image.drvPath --no-write-lock-file)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "drv=$drv" >> "$GITHUB_OUTPUT"
          printf 'source %s\ndrvPath %s\nworkflow blob %s\n' "$sha" "$drv" "$(git rev-parse HEAD:.github/workflows/own-image.yml)" >> "$GITHUB_STEP_SUMMARY"
      - name: Evaluate flake checks
        run: nix flake check --no-write-lock-file --print-build-logs
      - name: Realize own tools and prove native generations without building the base image
        run: |
          set -euo pipefail
          core=$(nix build .#own-core --no-link --print-out-paths --no-write-lock-file)
          t0=$(nix build .#own-profile --no-link --print-out-paths --no-write-lock-file)
          t1=$(nix build .#own-profile-next --no-link --print-out-paths --no-write-lock-file)
          legacy=$(nix build .#own-profile-legacy --no-link --print-out-paths --no-write-lock-file)
          p=$RUNNER_TEMP/own-native-profile
          test ! -e "$p" && test ! -L "$p"
          export PATH="$core/bin:$p/bin:$PATH"
          nix-env --profile "$p" --set "$legacy"
          nix-env --profile "$p" --set "$t0"
          nix-env --profile "$p" --set "$t1"
          "$p/bin/hello" >/dev/null
          nix-env --profile "$p" --rollback
          test "$(readlink -e "$p")" = "$t0"
          nix-env --profile "$p" --list-generations
          test "$(readlink -e "$p/bin/git-credential-github-roccho-dev")" = "$(readlink -e "$core/bin/git-credential-github-roccho-dev")"
          test "$(dirname "$(readlink -e "$p/bin/codex")")" = "$(dirname "$(readlink -e "$p/bin/codex-code-mode-host")")"
          test "$(command -v nix)" = "$core/bin/nix"
          test "$(command -v gh)" = "$core/bin/gh"
          PI_CODING_AGENT_DIR=$RUNNER_TEMP/own-pi-state "$p/bin/pi" --version
          test ! -e "$RUNNER_TEMP/own-pi-state/auth.json"
          echo 'PASS own T realization, native legacy/set/update/rollback, fixed H_B, core precedence and paired package' >> "$GITHUB_STEP_SUMMARY"
      # The same production gh outputs under another target's helper name, without an image, on this disposable runner:
      # bind and routing reach only the declared principal's slot (synthetic token), whatever the repository namespace.
      - name: Alternate credential owner through the production gh outputs (CI only, synthetic token)
        run: |
          set -euo pipefail
          out=$(nix build .#ci-alt-owner-gh --no-write-lock-file --no-link --print-out-paths)
          p=/nix/var/nix/profiles/ci-alt-owner
          test ! -e "$p" && test ! -L "$p" && test ! -e /work
          sudo ln -s "$out" "$p"
          h=$p/bin/git-credential-github-alt-owner
          u=https://github.com/alt-owner/windows
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          sudo install -d -m 755 /work /work/repos /work/repos/.auth
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /work/repos/.auth/alt-owner
          root=/work/repos/.auth/alt-owner/gh
          install -d -m 700 "$root"
          printf 'github.com:\n    users:\n        alt-owner:\n            oauth_token: ci-alt-token\n    git_protocol: https\n    user: alt-owner\n    oauth_token: ci-alt-token\n' > "$root/hosts.yml"
          printf 'version: "1"\n' > "$root/config.yml"
          chmod 600 "$root/hosts.yml" "$root/config.yml"
          r=$(mktemp -d)
          git init -q "$r/a"
          git -C "$r/a" config remote.origin.url "$u"
          test "$("$h" bind "$r/a" "$u" alt-owner)" = "bind result=ok reason=- repo=$r/a url=$u prior=AAAAAAAPA writes=8 restored=0 retained=0"
          fill() { printf 'protocol=https\nhost=github.com\npath=%s\n\n' "$2" | (cd "$1" && git credential fill 2>/dev/null) | sed -n 's/^password=//p'; }
          test "$(fill "$r/a" alt-owner/windows)" = ci-alt-token
          test "$(cd "$r/a" && "$p/bin/gh" auth token)" = ci-alt-token
          # The namespace is not the principal: a roccho-dev repository declared for alt-owner reaches alt-owner's slot.
          git init -q "$r/b"
          git -C "$r/b" config remote.origin.url https://github.com/roccho-dev/windows
          test "$("$h" bind "$r/b" https://github.com/roccho-dev/windows alt-owner)" = "bind result=ok reason=- repo=$r/b url=https://github.com/roccho-dev/windows prior=AAAAAAAPA writes=8 restored=0 retained=0"
          test "$(fill "$r/b" roccho-dev/windows)" = ci-alt-token
          # A principal without a slot gets nothing; no token outside a bound clone.
          git init -q "$r/c"
          git -C "$r/c" config remote.origin.url https://github.com/roccho-dev/windows
          case $("$h" bind "$r/c" https://github.com/roccho-dev/windows roccho-dev) in "bind result=ok "*) ;; *) exit 1 ;; esac
          test -z "$(fill "$r/c" roccho-dev/windows)"
          if (cd "$r/c" && "$p/bin/gh" auth token) > /dev/null 2>&1; then echo 'gh returned a token for a principal without a slot' >&2; exit 1; fi
          test -z "$(printf 'protocol=https\nhost=github.com\npath=roccho-dev/windows\nusername=alt-owner\n\n' | "$h" get)"
          if (cd "$r" && "$p/bin/gh" auth token) > /dev/null 2>&1; then echo 'alt-owner gh outside a bound clone returned a token' >&2; exit 1; fi
          echo 'PASS alternate helper name: production bind and routing reach only the declared principal, whatever the namespace' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build actual own OCI image and the CI-only upgrade image
        if: ${{ !inputs.tool_only }}
        run: nix build .#own-image .#own-image-next --no-write-lock-file --print-build-logs
      # The completed own B2 interaction trial is not rerun here; its step text stays in history (own-image.yml at
      # 21b31e1) with its passing runs. This checks own adoption without Xpra: a fresh start, a successful same-image
      # restart and a recreation on the same volumes, each with strict SSH and the three loopback CDP pages.
      - name: Seed, lock, restart and recreation with short SSH/Nix/CDP checks (no real logins)
        if: ${{ !inputs.tool_only }}
        shell: bash
        run: |
          set -euo pipefail
          docker load < result
          docker load < result-1
          image=$(docker image inspect ghcr.io/roccho-dev/windows-own:nix --format '{{.Id}}')
          next=$(docker image inspect ghcr.io/roccho-dev/windows-own:next --format '{{.Id}}')
          d="$(mktemp -d)"
          # Every file this step writes under $d; the exit trap removes exactly these, then the empty directory.
          d_files=(after head1 key key.pub known_hosts out)
          # Removes one of those regular files; a link or other type is kept and fails the step.
          plain() { if [ -L "$1" ] || { [ -e "$1" ] && [ ! -f "$1" ]; }; then echo "kept unexpected entry $1" >&2; return 1; fi; rm -f -- "$1"; }
          trap 'status=$?; [ "$status" -eq 0 ] || docker logs own-smoke 2>&1 | tail -n 40 || true; docker rm -f own-smoke own-hold >/dev/null 2>&1 || true; docker volume rm own-smoke-home own-smoke-work own-smoke-nix own-smoke-empty own-smoke-foreign >/dev/null 2>&1 || true; for f in "${d_files[@]}"; do plain "$d/$f" || exit 1; done; rmdir -- "$d" || { echo "kept $d: unexpected entries" >&2; exit 1; }' EXIT
          fail() { echo "FAIL $*" >&2; exit 1; }
          ssh-keygen -q -t ed25519 -N '' -f "$d/key"
          for v in home work nix empty foreign; do docker volume create "own-smoke-$v" >/dev/null; done
          nixm() { echo "type=volume,source=$1,target=/nix,volume-nocopy"; }
          ids=(-e OWN_HOME_VOLUME=own-smoke-home -e OWN_WORK_VOLUME=own-smoke-work -e OWN_NIX_VOLUME=own-smoke-nix)
          home=(-v own-smoke-home:/home/dev); work=(-v own-smoke-work:/work/repos); nixv=(--mount "$(nixm own-smoke-nix)")
          seed() { docker run --rm -v "own-smoke-$2:/seed" -e "OWN_NIX_VOLUME=own-smoke-$2" "$1" /bin/own-nix-seed; }
          # Every name, size and mtime under the nix volume: "nothing written" is an exact comparison.
          listing() { docker run --rm -v "own-smoke-${1:-nix}:/n" "$image" /bin/bash -c 'cd /n && find . -printf "%p %s %T@\n" | LC_ALL=C sort | sha256sum'; }
          # The seed copies exactly the image's GC-rooted closure, so no store entry's name (after its hash) may name Xpra.
          # The listing is read whole first (a failed read ends the step) and must show the seeded roots; the match then
          # runs on that text, so neither a read failure nor an early-exiting reader can pass for absence.
          no_xpra_store() {
            local names
            names=$(docker run --rm -v own-smoke-nix:/n "$image" /bin/ls /n/store)
            [[ $names == *-own-nix-roots* ]] || fail "the $1 seeded store listing has no own-nix-roots"
            names=$(sed 's/^[0-9a-z]*-//' <<<"$names")
            if [[ ${names,,} == *xpra* ]]; then fail "xpra in the $1 seeded store"; fi
          }
          refuse() {
            local want=$1; shift
            if timeout 60 docker run --rm "$@" "$image" > "$d/out" 2>&1; then fail "started despite: $want"; fi
            grep -qF "$want" "$d/out" || { cat "$d/out" >&2; fail "wrong refusal for: $want"; }
            if grep -qF 'own-mounts ok' "$d/out"; then fail "gate passed despite: $want"; fi
          }

          # An empty /nix hides the image store: nothing can start, and nothing is written.
          if docker run --rm --mount "$(nixm own-smoke-empty)" "$image" > "$d/out" 2>&1; then fail 'started on an empty /nix'; fi
          test -z "$(docker run --rm -v own-smoke-empty:/e "$image" /bin/ls -A /e)" || fail 'an empty /nix was written'

          # Fresh seed creates B only. No selected app generation or bound-auth readiness is inferred.
          roots=$(docker run --rm "$image" /bin/readlink /etc/own-nix-roots)
          seed "$image" nix | grep -qE "^own-nix-seed ok volume=own-smoke-nix roots=$roots copied=[1-9][0-9]*$" || fail 'fresh seed'
          no_xpra_store fresh
          test "$(docker run --rm -v own-smoke-nix:/n "$image" /bin/ls -A /n | tr '\n' ' ')" = 'store var ' || fail 'unexpected top-level entries'
          seed "$image" nix | grep -qxF "own-nix-seed ok volume=own-smoke-nix roots=$roots copied=0" || fail 'reseed was not a no-op'
          test "$(docker run --rm -v own-smoke-nix:/n "$image" /bin/bash -euc 'test ! -e /n/var/nix/profiles/own-dev; test ! -L /n/var/nix/profiles/own-dev; echo absent')" = absent || fail 'base seed selected apps'
          # Selector absence is fresh only when the native profile state is genuinely absent and owned.
          seed "$image" empty >/dev/null
          empty_ids=(-e OWN_HOME_VOLUME=own-smoke-home -e OWN_WORK_VOLUME=own-smoke-work -e OWN_NIX_VOLUME=own-smoke-empty)
          for kind in orphan residue symlink owner; do
            docker run --rm -v own-smoke-empty:/n "$image" /bin/bash -euc '
              p=/n/var/nix/profiles; install -d -m 755 "$p"
              case $1 in
                orphan) ln -s /nix/store/00000000000000000000000000000000-orphan "$p/own-dev-1-link" ;;
                residue) ln -s own-dev-1-link "$p/.own-dev.new" ;;
                symlink) test ! -e "$p.ci-prior" && test ! -L "$p.ci-prior"; mv "$p" "$p.ci-prior"; ln -s /n/var "$p" ;;
                owner) chown 1000:1000 "$p" ;;
              esac' -- "$kind"
            before=$(listing empty)
            if seed "$image" empty > "$d/out" 2>&1; then fail "fresh accepted $kind profile residue"; fi
            grep -qF 'foreign, invalid or incompatible retained generation; unchanged' "$d/out" || fail "wrong $kind profile refusal"
            test "$(listing empty)" = "$before" || fail "$kind profile refusal wrote"
            refuse 'own-profile: foreign, invalid or incompatible retained generation; unchanged' "${home[@]}" "${work[@]}" --mount "$(nixm own-smoke-empty)" "${empty_ids[@]}"
            docker run --rm -v own-smoke-empty:/n "$image" /bin/bash -euc '
              p=/n/var/nix/profiles
              case $1 in
                orphan) rm -- "$p/own-dev-1-link" ;;
                residue) rm -- "$p/.own-dev.new" ;;
                symlink) rm -- "$p"; mv "$p.ci-prior" "$p" ;;
                owner) chown 0:0 "$p" ;;
              esac' -- "$kind"
          done
          # An interrupted copy leaves its staging directory: the seed refuses, writes nothing and never deletes it.
          docker run --rm -v own-smoke-nix:/n "$image" /bin/bash -c 'install -d -m 700 /n/.own-seed.interrupt && echo foreign > /n/.own-seed.interrupt/partial'
          before=$(listing)
          if seed "$image" nix > "$d/out" 2>&1; then fail 'seeded over an interrupted staging directory'; fi
          grep -qF '/seed/.own-seed.interrupt is left from an interrupted seed; not deleting it' "$d/out" || fail 'interrupted staging refusal'
          test "$(listing)" = "$before" || fail 'a seed refused for an interrupted staging directory wrote'
          docker run --rm -v own-smoke-nix:/n "$image" /bin/bash -c 'f=/n/.own-seed.interrupt/partial; [ -f $f ] && [ ! -L $f ] && [ "$(cat $f)" = foreign ] && rm -- $f && rmdir -- ${f%/*}'
          seed "$image" nix | grep -qxF "own-nix-seed ok volume=own-smoke-nix roots=$roots copied=0" || fail 'seed after inspecting the staging directory'
          docker run --rm -v own-smoke-foreign:/f "$image" /bin/bash -c 'echo x > /f/x'
          if seed "$image" foreign > "$d/out" 2>&1; then fail 'seeded a foreign volume'; fi
          grep -qF '/seed is neither empty nor an own /nix volume' "$d/out" || fail 'foreign volume refusal'

          # Mount gate before any service.
          refuse 'own-mounts: set OWN_HOME_VOLUME, OWN_WORK_VOLUME and OWN_NIX_VOLUME' "${home[@]}" "${work[@]}" "${nixv[@]}"
          refuse 'own-mounts: /work/repos must be exactly volume own-smoke-work, rw' "${home[@]}" "${nixv[@]}" "${ids[@]}"
          refuse 'own-mounts: /home/dev must be exactly volume own-smoke-home, rw' -v own-smoke-home:/home/dev:ro "${work[@]}" "${nixv[@]}" "${ids[@]}"
          refuse 'own-mounts: /home/dev must be exactly volume own-smoke-home' -v own-smoke-foreign:/home/dev "${work[@]}" "${nixv[@]}" "${ids[@]}"
          refuse 'own-mounts: /nix must be exactly volume own-smoke-nix, rw' "${home[@]}" "${work[@]}" --mount "$(nixm own-smoke-nix),readonly" "${ids[@]}"
          refuse 'own-mounts: exactly three volumes are allowed' "${home[@]}" "${work[@]}" "${nixv[@]}" -v own-smoke-empty:/extra "${ids[@]}"

          # Waits for one more gate line than $1: a restarted container keeps its earlier log.
          gate() {
            for _ in {1..60}; do
              [ "$(docker logs own-smoke 2>&1 | grep -cxF 'own-mounts ok home=own-smoke-home work=own-smoke-work nix=own-smoke-nix')" -gt "$1" ] && return 0
              sleep 1
            done
            fail 'own-start did not pass its gate'
          }
          run() {
            docker run -d --name own-smoke --shm-size 1g -p 127.0.0.1:2223:2223 "${home[@]}" "${work[@]}" "${nixv[@]}" "${ids[@]}" \
              -e OWN_TRIAL_UNSANDBOXED=1 "$@" >/dev/null
            gate 0
          }
          ssh_cmd=(ssh -F /dev/null -p 2223 -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o GlobalKnownHostsFile=/dev/null -o "UserKnownHostsFile=$d/known_hosts" dev@127.0.0.1)
          ssh_ready() { for _ in {1..60}; do "${ssh_cmd[@]}" true 2>/dev/null && return 0; sleep 1; done; fail 'ssh'; }
          # Owner Git/gh on the running own-smoke. Synthetic hostile system, global and XDG Git helpers and HOME/XDG gh
          # logins (fake tokens) would each answer if read; the controls show they do. The owner root holds the owner
          # fixture. The owner clone is bound by the production bind; the other clones are hostile raw edits.
          owner_proof() {
            docker exec own-smoke /bin/bash -euc '
              # hosts DIR TOKEN [USER]: one synthetic account in a current-format gh file store.
              hosts() {
                install -d -m 700 -o 1000 -g 1000 "$1"
                printf "github.com:\n    users:\n        %s:\n            oauth_token: %s\n    git_protocol: https\n    user: %s\n    oauth_token: %s\n" "${3:-ci}" "$2" "${3:-ci}" "$2" > "$1/hosts.yml"
                printf "version: \"1\"\n" > "$1/config.yml"
                chown 1000:1000 "$1/hosts.yml" "$1/config.yml"; chmod 600 "$1/hosts.yml" "$1/config.yml"
              }
              helper() { printf "[credential]\n\thelper = \"!echo username=ci; echo password=%s #\"\n" "$2" > "$1"; }
              install -d -m 755 /work/repos/.auth
              install -d -m 700 -o 1000 -g 1000 /work/repos/.auth/roccho-dev
              hosts /work/repos/.auth/roccho-dev/gh ci-owner-token roccho-dev
              install -d -m 755 -o 1000 -g 1000 /home/dev/xdg /home/dev/.config/git
              hosts /home/dev/.config/gh ci-home-token
              hosts /home/dev/xdg/gh ci-xdg-token
              helper /etc/gitconfig ci-system-token
              helper /home/dev/.gitconfig ci-global-token
              helper /home/dev/.config/git/config ci-xdg-git-token
              chown 1000:1000 /home/dev/.gitconfig /home/dev/.config/git/config'
            # One matrix for both routes, each in its own clones owned by the user it runs as, so Git never refuses a
            # repository for dubious ownership (checked before any credential request).
            local matrix
            read -r -d '' matrix <<'EOF' || true
          test "$GIT_CONFIG_NOSYSTEM" = 1 && test "$GIT_CONFIG_GLOBAL" = /dev/null
          test "$(id -u)" = "$want_uid"
          h=/nix/var/nix/profiles/own-dev/bin/git-credential-github-roccho-dev
          test -x "$h"
          install -d -m 700 "$r"
          cd "$r"
          for x in bound unbound other mismatch badhelper; do git init -q "$x"; done
          : > "$r/empty-store"
          bind() {
            git -C "$1" config remote.origin.url "$2"
            git -C "$1" config --replace-all credential.helper ""
            git -C "$1" config --replace-all "credential.$3.helper" "${4:-$h}"
            git -C "$1" config credential.useHttpPath true
            git -C "$1" config http.followRedirects false
          }
          git -C bound config remote.origin.url https://github.com/roccho-dev/windows
          case $("$h" bind "$r/bound" https://github.com/roccho-dev/windows roccho-dev) in "bind result=ok "*) ;; *) exit 1 ;; esac
          git -C unbound config remote.origin.url https://github.com/roccho-dev/windows
          bind other https://github.com/other/windows https://github.com/other/windows
          # The owner's origin with the owner helper bound to another URL.
          bind mismatch https://github.com/roccho-dev/windows https://github.com/other/windows
          # The owner's origin and URL bound to a different real helper (Git's store, on an empty file).
          bind badhelper https://github.com/roccho-dev/windows https://github.com/roccho-dev/windows "store --file=$r/empty-store"
          for x in bound unbound other mismatch badhelper; do git -C "$x" rev-parse --git-dir > /dev/null; done
          fill() {
            local w=$1 p=$2; shift 2
            printf "protocol=https\nhost=github.com\npath=%s\n\n" "$p" | (cd "$w" && env "$@" GIT_TERMINAL_PROMPT=0 git credential fill 2>/dev/null) |
              sed -n "s/^password=//p"
          }
          # No credential at all: Git must fail and print nothing.
          nofill() {
            local out
            if out=$(printf "protocol=https\nhost=github.com\npath=%s\n\n" "$2" | (cd "$1" && GIT_TERMINAL_PROMPT=0 git credential fill 2>/dev/null)); then
              echo "$1: git credential fill succeeded" >&2; return 1
            fi
            test -z "$out"
          }
          # Controls, each changing one variable of this same environment: every hostile fixture answers on its own.
          test "$(fill unbound roccho-dev/windows -u GIT_CONFIG_NOSYSTEM)" = ci-system-token
          test "$(fill unbound roccho-dev/windows GIT_CONFIG_GLOBAL="$HOME/.gitconfig")" = ci-global-token
          test "$(fill unbound roccho-dev/windows GIT_CONFIG_GLOBAL="$HOME/.config/git/config")" = ci-xdg-git-token
          case $(fill unbound roccho-dev/windows -u GIT_CONFIG_GLOBAL) in ci-xdg-git-token|ci-global-token) ;; *) exit 1 ;; esac
          # gh without the owner routing: the shared wrapper's own underlying gh, run directly only for these controls,
          # returns the HOME login, the XDG login and a GH_TOKEN.
          gh_real=$(sed -n 's|^[[:space:]]*exec \(/nix/store/[^ ]*/bin/gh\) .*|\1|p' "$(readlink -e "$(command -v gh)")")
          test -x "$gh_real"
          test "$(cd "$HOME" && env -u GH_CONFIG_DIR -u XDG_CONFIG_HOME "$gh_real" auth token)" = ci-home-token
          test "$(cd "$HOME" && env -u GH_CONFIG_DIR XDG_CONFIG_HOME="$HOME/xdg" "$gh_real" auth token)" = ci-xdg-token
          test "$(cd "$HOME" && env -u GH_CONFIG_DIR GH_TOKEN=ci-env-gh "$gh_real" auth token)" = ci-env-gh
          test "$(fill bound roccho-dev/windows)" = ci-owner-token
          nofill unbound roccho-dev/windows
          nofill other other/windows
          nofill mismatch roccho-dev/windows
          nofill badhelper roccho-dev/windows
          nofill "$HOME" roccho-dev/windows
          gh --version | grep "^gh version " > /dev/null
          test "$(cd bound && gh auth token)" = ci-owner-token
          for x in unbound other mismatch badhelper "$HOME"; do if (cd "$x" && gh auth token) > /dev/null 2>&1; then echo "$x: gh returned a token" >&2; exit 1; fi; done
          # Token, host and XDG overrides never win.
          export XDG_CONFIG_HOME="$HOME/xdg" GH_TOKEN=ci-env-gh GITHUB_TOKEN=ci-env-github GH_ENTERPRISE_TOKEN=ci-env-ghe \
            GITHUB_ENTERPRISE_TOKEN=ci-env-ghes GH_HOST=evil.example
          test "$(cd bound && gh auth token)" = ci-owner-token
          for x in unbound other mismatch badhelper "$HOME"; do if (cd "$x" && gh auth token) > /dev/null 2>&1; then echo "$x: gh returned a token with overrides" >&2; exit 1; fi; done
          echo "owner git/gh ok uid=$want_uid"
          EOF
            [ "$("${ssh_cmd[@]}" 'bash -s' <<<"set -euo pipefail; want_uid=1000; r=/work/repos/gh-dev; $matrix")" = 'owner git/gh ok uid=1000' ] ||
              fail 'owner Git/gh over ordinary SSH'
            [ "$(docker exec -i own-smoke /bin/bash -s <<<"set -euo pipefail; want_uid=0; r=/work/repos/gh-root; $matrix")" = 'owner git/gh ok uid=0' ] ||
              fail 'owner Git/gh through the image-default docker exec'
          }
          # The production bind of the own profile helper, over the strict SSH route as dev, on synthetic clones only:
          # the observed form binds all nine settings and a repeat is a no-op; a clone bound by the earlier seven
          # settings gains only the two usernames; a wrong invocation, an unowned clone, every conflicting (another
          # principal included), repeated or unexpected local setting and a worktree config are refused with nothing
          # written; a write failure part way (a file-size limit) restores this invocation's write and nothing else.
          bind_proof() {
            docker exec own-smoke /bin/bash -euc 'install -d -m 700 -o 1000 -g 1000 /work/repos/bind-proof
              git init -q /work/repos/bind-proof/rootowned
              git -C /work/repos/bind-proof/rootowned config remote.origin.url https://github.com/roccho-dev/windows'
            local bindm
            read -r -d '' bindm <<'EOF' || true
          h=/nix/var/nix/profiles/own-dev/bin/git-credential-github-roccho-dev
          u=https://github.com/roccho-dev/windows
          r=/work/repos/bind-proof
          # expect CODE RESULT REASON CMD...: exactly one result line with that result and reason, and exit CODE.
          expect() {
            local want=$1 res=$2 why=$3 out rc=0; shift 3
            out=$("$@" 2>&1) || rc=$?
            [ "$rc" = "$want" ] && [[ $out == "bind result=$res reason=$why "* ]] && [ "$(wc -l <<<"$out")" = 1 ] ||
              { echo "bind $*: exit $rc, not $want: $out" >&2; exit 1; }
            printf '%s\n' "$out"
          }
          a=roccho-dev
          fresh() { git init -q "$r/$1"; git -C "$r/$1" config remote.origin.url "$2"; }
          cfg() { git -C "$r/$1" config --local --list; }
          nine() {
            local k v
            for k in "credential.helper=" "credential.$u.helper=$h" "credential.$u.git.helper=$h" "credential.$u.username=$a" \
              "credential.$u.git.username=$a" credential.useHttpPath=true http.followRedirects=false "remote.origin.url=$u" \
              "remote.origin.pushurl=$u"; do
              v=${k#*=}; k=${k%%=*}
              [ "$(git -C "$r/$1" config --local --get-all "$k" | wc -l)" = 1 ] && [ "$(git -C "$r/$1" config --local --get "$k")" = "$v" ] ||
                { echo "$1: $k is not bound" >&2; exit 1; }
            done
          }
          fresh p "$u.git"
          [ "$(expect 0 ok - "$h" bind "$r/p" "$u" "$a")" = "bind result=ok reason=- repo=$r/p url=$u prior=AAAAAAAGA writes=9 restored=0 retained=0" ]
          nine p
          before=$(cfg p)
          [ "$(expect 0 ok - "$h" bind "$r/p" "$u" "$a")" = "bind result=ok reason=- repo=$r/p url=$u prior=PPPPPPPPP writes=0 restored=0 retained=0" ]
          [ "$(cfg p)" = "$before" ]
          # The earlier seven settings, exactly: only the two usernames are added, and the same bind then repeats as a no-op.
          fresh old "$u"
          for k in "credential.helper=" "credential.$u.helper=$h" "credential.$u.git.helper=$h" credential.useHttpPath=true \
            http.followRedirects=false "remote.origin.pushurl=$u"; do git -C "$r/old" config "${k%%=*}" "${k#*=}"; done
          [ "$(expect 0 ok - "$h" bind "$r/old" "$u" "$a")" = "bind result=ok reason=- repo=$r/old url=$u prior=PPPAAPPPP writes=2 restored=0 retained=0" ]
          nine old
          [[ $(expect 0 ok - "$h" bind "$r/old" "$u" "$a") == *" prior=PPPPPPPPP writes=0 "* ]]
          # Wrong invocations, including an action Git appends to a helper value carrying bind, the earlier three-argument
          # form, invalid URLs and principals, and a store-path helper.
          expect 2 usage argc "$h" bind "$r/p" "$u" > /dev/null
          expect 2 usage argc "$h" bind "$r/p" "$u" "$a" get > /dev/null
          expect 2 usage url "$h" bind "$r/p" https://github.com/other "$a" > /dev/null
          expect 2 usage url "$h" bind "$r/p" "$u.git" "$a" > /dev/null
          expect 2 usage url "$h" bind "$r/p" http://github.com/roccho-dev/windows "$a" > /dev/null
          expect 2 usage principal "$h" bind "$r/p" "$u" x-access-token > /dev/null
          expect 2 usage principal "$h" bind "$r/p" "$u" -bad > /dev/null
          expect 2 usage principal "$h" bind "$r/p" "$u" "" > /dev/null
          expect 2 usage repo "$h" bind relative "$u" "$a" > /dev/null
          expect 2 usage helper "$(readlink -f "$h")" bind "$r/p" "$u" "$a" > /dev/null
          [ "$(cfg p)" = "$before" ]
          # Another user's clone: Git itself refuses it, and nothing is written.
          expect 6 refused repo "$h" bind "$r/rootowned" "$u" "$a" > /dev/null
          # conflict NAME REASON [git config ARGS]: one change to a fresh owner clone; refused and unchanged.
          conflict() {
            local n=$1 why=$2 b; shift 2
            fresh "$n" "$u"
            [ "$#" = 0 ] || git -C "$r/$n" config "$@"
            b=$(cfg "$n")
            expect 6 refused "$why" "$h" bind "$r/$n" "$u" "$a" > /dev/null
            [ "$(cfg "$n")" = "$b" ] || { echo "$n changed" >&2; exit 1; }
          }
          conflict principal conflict "credential.$u.username" mti-takasawa
          conflict principal-git conflict "credential.$u.git.username" mti-takasawa
          conflict no-origin conflict --unset remote.origin.url
          conflict foreign-origin conflict remote.origin.url https://github.com/other/windows
          conflict two-origins conflict --add remote.origin.url "$u"
          conflict redirects conflict http.followRedirects true
          conflict helper conflict credential.helper store
          conflict pushurl conflict remote.origin.pushurl https://example.invalid/windows
          conflict other-helper unexpected credential.https://example.invalid.helper store
          conflict insteadof unexpected url.https://example.invalid/.insteadOf https://github.com/
          conflict header unexpected http.extraHeader x
          conflict include unexpected include.path /dev/null
          conflict worktree worktreeConfig extensions.worktreeConfig true
          # The first write fits and the second exceeds a file-size limit (ignored signal, so Git sees EFBIG and keeps
          # its config): only that first write is undone, and the clone's settings are as before.
          fresh limit "$u.git"
          git -C "$r/limit" config proof.pad x
          s=$(stat -c %s "$r/limit/.git/config")
          git -C "$r/limit" config proof.pad "$(head -c $((1989 - s)) /dev/zero | tr '\0' x)"
          [ "$(stat -c %s "$r/limit/.git/config")" = 1988 ]
          before=$(cfg limit)
          out=$( (trap '' XFSZ; ulimit -f 2; expect 7 restored write "$h" bind "$r/limit" "$u" "$a") )
          [ "$out" = "bind result=restored reason=write repo=$r/limit url=$u prior=AAAAAAAGA writes=1 restored=1 retained=0" ]
          [ "$(cfg limit)" = "$before" ]
          echo "own bind ok"
          EOF
            [ "$("${ssh_cmd[@]}" 'bash -s' <<<"set -euo pipefail; $bindm")" = 'own bind ok' ] || fail 'production bind over SSH'
          }
          # Each headless profile serves its own page on its loopback CDP port, read through strict SSH; no Xpra
          # process runs and none is on the SSH PATH.
          display() {
            local p
            for p in 1 2 3; do
              for _ in {1..60}; do
                "${ssh_cmd[@]}" "curl -fsS --max-time 5 http://127.0.0.1:$((9221 + p))/json/list" 2>/dev/null |
                  jq -e --arg t "own p$p" 'any(.[]; .type == "page" and .title == $t)' >/dev/null && continue 2
                sleep 1
              done
              fail "no CDP page own p$p"
            done
            # The process list is read whole first and must show own-start and sshd; store hashes are dropped before the
            # match (base32 can spell it).
            local procs
            procs=$(docker top own-smoke)
            [[ $procs == *own-start* && $procs == *sshd* ]] || fail 'docker top did not list own-start and sshd'
            procs=$(sed -E 's|/nix/store/[0-9a-z]{32}-|/nix/store/|g' <<<"$procs")
            if [[ ${procs,,} == *xpra* ]]; then fail 'an xpra process runs'; fi
            "${ssh_cmd[@]}" 'if command -v xpra; then exit 1; fi' || fail 'xpra is on the SSH PATH'
          }
          run -e "OWN_AUTHORIZED_KEY=$(cat "$d/key.pub")" "$image"
          # The host key is pinned from the home volume, never accepted anew.
          printf '[127.0.0.1]:2223 %s\n' "$(docker exec own-smoke /bin/cat /home/dev/.ssh/ssh_host_ed25519_key.pub | cut -d' ' -f1,2)" > "$d/known_hosts"
          ssh_ready
          # B-native public fixed tarball fetch works before the configured helper locator exists.
          docker exec own-smoke /bin/bash -euc 'test ! -e /nix/var/nix/profiles/own-dev; test -x /bin/gh; test ! -x /bin/codex'
          source=$(git rev-parse HEAD)
          docker exec own-smoke /bin/nix flake metadata "github:$GITHUB_REPOSITORY/$source" --no-write-lock-file --json >/dev/null
          t0=$(nix eval --raw .#own-profile --no-write-lock-file)
          t1=$(nix eval --raw .#own-profile-next --no-write-lock-file)
          legacy_profile=$(nix eval --raw .#own-profile-legacy --no-write-lock-file)
          # Native store transport on this ephemeral runner only, never a real own volume or credential.
          nix-store --export $(nix-store --query --requisites "$t0" "$t1" "$legacy_profile") |
            docker exec -i own-smoke /bin/nix-store --import >/dev/null
          got=$(docker exec own-smoke /bin/nix build "github:$GITHUB_REPOSITORY/$source#own-profile" --no-link --print-out-paths --no-write-lock-file)
          test "$got" = "$t0" || fail 'public fixed source realized a different T'
          # The controller owns a coordinated quiet interval: supported apps and children are absent and no
          # app launch runs concurrently with these sole UID0 native profile operations. Native set is not a gate.
          native_set() {
            local uid expected got cli host closure
            uid=$(docker exec own-smoke /bin/id -u) || return 1
            test "$uid" = 0 || return 1
            # Docker requires the PID column to translate the host process inventory into this container.
            procs=$(docker top own-smoke -eo pid,args) || return 1
            [[ $procs == *own-start* && $procs == *sshd* && $procs == *nix-daemon* ]] || return 1
            if grep -qE '/bin/(codex|codex-code-mode-host|claude|pi)( |$)|/share/pi/pi( |$)' <<<"$procs"; then return 1; fi
            expected=$(docker exec own-smoke /bin/readlink -e /bin/git-credential-github-roccho-dev) || return 1
            got=$(docker exec own-smoke /bin/readlink -e "$1/bin/git-credential-github-roccho-dev") || return 1
            test "$expected" = "$got" || return 1
            cli=$(docker exec own-smoke /bin/readlink -e "$1/bin/codex") || return 1
            host=$(docker exec own-smoke /bin/readlink -e "$1/bin/codex-code-mode-host") || return 1
            test "${cli%/*}" = "${host%/*}" || return 1
            docker exec own-smoke /bin/test -x "$cli" || return 1
            docker exec own-smoke /bin/test -x "$host" || return 1
            closure=$(docker exec own-smoke /bin/nix-store --query --requisites "$1") || return 1
            docker exec own-smoke /bin/nix-store --check-validity $closure || return 1
            docker exec own-smoke /bin/nix-env --profile /nix/var/nix/profiles/own-dev --set "$1"
          }
          native_set "$legacy_profile"
          native_set "$t0"
          test "$(docker exec own-smoke /bin/readlink /nix/var/nix/profiles/own-dev)" = own-dev-2-link || fail 'native legacy migration'
          selected_before=$(docker exec own-smoke /bin/readlink /nix/var/nix/profiles/own-dev)
          # A conservative live-app observation refuses, and the process exits by itself; no kill is introduced.
          # Keep a real shell parent and child alive; an argv0-renamed multi-call coreutils sleep can exit early.
          docker exec -d own-smoke /bin/bash -c 'exec -a /bin/codex /bin/bash -c "sleep 4; :"'
          for _ in {1..20}; do
            observed=$(docker top own-smoke -eo pid,args) || fail 'active fixture observation UNKNOWN'
            grep -qF '/bin/codex -c' <<<"$observed" && break
            sleep 0.1
          done
          grep -qF '/bin/codex -c' <<<"$observed" || fail 'active parent fixture did not remain running'
          if native_set "$t1"; then fail 'selected while an app parent is active'; fi
          test "$(docker exec own-smoke /bin/readlink /nix/var/nix/profiles/own-dev)" = "$selected_before" || fail 'active refusal changed selection'
          sleep 5
          if docker exec -u 1000 own-smoke /bin/nix-env --profile /nix/var/nix/profiles/own-dev --set "$t1"; then fail 'dev became a profile writer'; fi
          test "$(docker exec own-smoke /bin/readlink /nix/var/nix/profiles/own-dev)" = "$selected_before" || fail 'untrusted writer changed selection'
          if docker exec own-smoke /bin/nix build "github:$GITHUB_REPOSITORY/$source#absent-own-proof" --no-link --no-write-lock-file; then fail 'invalid realization succeeded'; fi
          test "$(docker exec own-smoke /bin/readlink /nix/var/nix/profiles/own-dev)" = "$selected_before" || fail 'failed realization changed selection'
          # Prepare synthetic state as its declared user before any app consumer can create home directories.
          "${ssh_cmd[@]}" 'set -eu; test "$(id -u)" = 1000; install -d -m 700 ~/.codex ~/.pi/own-ci; test "$(stat -c %u:%g ~/.codex)" = 1000:1000; test "$(stat -c %u:%g ~/.pi/own-ci)" = 1000:1000; printf synthetic-codex > ~/.codex/ci-marker; printf synthetic-auth > ~/.codex/auth.json; printf synthetic-pi > ~/.pi/own-ci/session-marker; chmod 600 ~/.codex/ci-marker ~/.codex/auth.json ~/.pi/own-ci/session-marker'
          app_state() { docker exec own-smoke /bin/bash -euc 'cd /home/dev; sha256sum .codex/ci-marker .codex/auth.json .pi/own-ci/session-marker; stat -c "%n %u:%g %a" .codex/ci-marker .codex/auth.json .pi/own-ci/session-marker'; }
          state_before=$(app_state)
          consumer='set -eu
            p=/nix/var/nix/profiles/own-dev
            for app in codex codex-code-mode-host claude pi; do
              test "$(readlink -e /bin/$app)" = "$(readlink -e $p/bin/$app)"
              test -x /bin/$app
            done
            test "$(dirname "$(readlink -e /bin/codex)")" = "$(dirname "$(readlink -e /bin/codex-code-mode-host)")"
            test "$(command -v gh)" = /bin/gh
            test "$(command -v nix)" = /bin/nix
            codex --version
            timeout 10 codex-code-mode-host --help </dev/null >/dev/null
            PI_PACKAGE_DIR=/absent PI_CODING_AGENT_DIR=/home/dev/.pi/own-ci pi --version
            test ! -e /home/dev/.pi/agent-oci-dev'
          docker exec own-smoke /bin/bash -c "$consumer"
          docker exec own-smoke /bin/bash -lc "$consumer"
          "${ssh_cmd[@]}" "$consumer"
          "${ssh_cmd[@]}" 'bash -l' <<<"$consumer"
          test "$(app_state)" = "$state_before" || fail 'initial app consumers changed known synthetic state'
          "${ssh_cmd[@]}" 'set -eu
            echo home > ~/own-home-marker
            git init -q /work/repos/p && cd /work/repos/p
            git -c user.name=ci -c user.email=ci@example.invalid commit -q --allow-empty -m first
            git rev-parse HEAD' > "$d/head1"
          display

          # Lock: a seed is refused while own holds the volume, and writes nothing.
          before=$(listing)
          if seed "$image" nix > "$d/out" 2>&1; then fail 'seeded while own runs'; fi
          grep -qF 'own-smoke-nix is in use by a running own container or another seed' "$d/out" || fail 'lock refusal'
          test "$(listing)" = "$before" || fail 'a refused seed wrote'
          docker stop -t 30 own-smoke >/dev/null
          # Any holder of the root lock, here a plain container, stops both a seed and own-start.
          docker run -d --name own-hold -v own-smoke-nix:/n "$image" /bin/bash -c 'exec 9</n; flock -x 9; echo held; exec sleep infinity' >/dev/null
          for _ in {1..30}; do docker logs own-hold 2>&1 | grep -qx held && break; sleep 1; done
          if seed "$image" nix > "$d/out" 2>&1; then fail 'seeded while another container holds the lock'; fi
          grep -qF 'is in use by a running own container or another seed' "$d/out" || fail 'held-lock seed refusal'
          docker start own-smoke >/dev/null
          test "$(docker wait own-smoke)" != 0 || fail 'own started while the lock was held'
          docker logs own-smoke 2>&1 | grep -qF 'own-nix: own-smoke-nix is in use by another own container or a seed' || fail 'held-lock start refusal'
          docker rm -f own-hold >/dev/null

          # Successful restart of the same container and image: the pinned host key, home and work state are kept.
          same=$(docker inspect --format '{{.Id}} {{.Image}}' own-smoke)
          test "${same#* }" = "$image" || fail 'not the first image'
          docker start own-smoke >/dev/null
          gate 1
          test "$(docker inspect --format '{{.Id}} {{.Image}}' own-smoke)" = "$same" || fail 'restart changed the container or image'
          ssh_ready
          "${ssh_cmd[@]}" 'test "$(cat ~/own-home-marker)" = home && cd /work/repos/p && git rev-parse HEAD' > "$d/after"
          test "$(cat "$d/after")" = "$(cat "$d/head1")" || fail 'restart lost home or work state'
          display
          docker stop -t 30 own-smoke >/dev/null

          # Tool update changes only a native generation, with B identity unchanged and no seed/image build.
          # No running context means UNKNOWN for activation; no native profile operation is attempted.
          if native_set "$t1"; then fail 'selected with no observable running context'; fi
          docker start own-smoke >/dev/null
          gate 2
          native_set "$t1"
          docker exec own-smoke /bin/bash -c "$consumer"
          test "$(app_state)" = "$state_before" || fail 'update changed native app state'
          selected=$(docker exec own-smoke /bin/readlink /nix/var/nix/profiles/own-dev)
          test "$selected" = own-dev-3-link || fail 'native update'
          docker exec own-smoke /bin/nix-env --profile /nix/var/nix/profiles/own-dev --rollback
          test "$(docker exec own-smoke /bin/readlink /nix/var/nix/profiles/own-dev)" = own-dev-2-link || fail 'native rollback'
          docker restart own-smoke >/dev/null
          gate 3
          test "$(docker exec own-smoke /bin/readlink /nix/var/nix/profiles/own-dev)" = own-dev-2-link || fail 'restart reselected highest generation'
          docker exec own-smoke /bin/bash -c "$consumer"
          test "$(app_state)" = "$state_before" || fail 'rollback or restart changed native app state'
          native_set "$t1"
          docker exec own-smoke /bin/nix-store --gc >/dev/null
          docker exec own-smoke /bin/nix-store --check-validity "$t0" "$t1" "$legacy_profile"
          docker stop -t 30 own-smoke >/dev/null
          # Foreign native-profile shape is retained. Both seed and start refuse before selecting an image default.
          docker run --rm -v own-smoke-nix:/n "$image" /bin/bash -euc 'ln -sfn "$1" /n/var/nix/profiles/own-dev' -- "$t0"
          before=$(listing)
          if seed "$image" nix > "$d/out" 2>&1; then fail 'seed accepted a foreign profile shape'; fi
          test "$(listing)" = "$before" || fail 'foreign profile refusal wrote'
          docker start own-smoke >/dev/null
          test "$(docker wait own-smoke)" != 0 || fail 'start accepted a foreign profile shape'
          docker logs own-smoke 2>&1 | grep -qF 'foreign, invalid or incompatible retained generation; unchanged' || fail 'foreign generation refusal missing'
          docker run --rm -v own-smoke-nix:/n "$image" /bin/bash -euc 'ln -sfn own-dev-3-link /n/var/nix/profiles/own-dev'
          seed "$next" nix | grep -qE "^own-nix-seed ok volume=own-smoke-nix roots=.* copied=0$" || fail 'base reseed should not copy or reselect T'
          no_xpra_store next
          old_id=$(docker inspect --format '{{.Id}}' own-smoke)
          docker rm own-smoke >/dev/null
          run "$next"
          test "$(docker inspect --format '{{.Id}}' own-smoke)" != "$old_id" || fail 'not a new container'
          ssh_ready
          docker exec own-smoke /bin/bash -c "$consumer"
          test "$(app_state)" = "$state_before" || fail 'recreation changed native app state'
          "${ssh_cmd[@]}" 'set -eu
            test "$(id -un)" = dev
            test "$NIX_REMOTE" = daemon
            hello > /dev/null
            test "$(readlink /nix/var/nix/profiles/own-dev)" = own-dev-3-link
            test "$(codex --version)" = "codex-cli $(release-version codex)"
            test "$(claude --version)" = "$(release-version claude) (Claude Code)"
            gh --version | grep -qE "^gh version 2\.96\.0( |$)"
            test "$(cat ~/own-home-marker)" = home && test ! -e /work/repos/own-home-marker
            cd /work/repos/p && git rev-parse HEAD
            git -c user.name=ci -c user.email=ci@example.invalid commit -q --allow-empty -m second
            nix build --impure --out-link /work/repos/p/result --expr "derivation { name = \"own-proof\"; system = \"x86_64-linux\"; builder = \"/bin/sh\"; args = [ \"-c\" \"echo built > \$out\" ]; }"
            test "$(cat /work/repos/p/result)" = built
            if touch /nix/store/dev-write 2>/dev/null; then exit 1; fi' > "$d/after"
          test "$(head -n1 "$d/after")" = "$(cat "$d/head1")" || fail 'work commit lost'
          docker exec own-smoke /bin/nix-store --verify --check-contents
          display
          echo 'PASS own seed, lock, gate, restart and recreation with SSH/Nix/CDP and no Xpra' | tee -a "$GITHUB_STEP_SUMMARY"
          bind_proof
          owner_proof
          echo 'PASS own production bind: nine settings with the declared principal, seven-setting upgrade, repeat no-op, invocation/principal/owner/conflict/unexpected/worktree refusals, same-invocation restore; declared principal Git/gh only in the bound clone over SSH (dev) and default exec (root)' | tee -a "$GITHUB_STEP_SUMMARY"
