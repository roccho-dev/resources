name: Prepare migration reference fixes
on:
  pull_request:
    paths: [.github/workflows/migration-reference-fix.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-migration-inventory-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Correct exact migration references and test the real release watcher
        run: |
          set -euo pipefail
          git diff --exit-code f699457a840664cbde59c878bb62c2c6451c2efc HEAD -- . ':!.github/workflows/migration-reference-fix.yml'
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, (path, s.count(old), old)
              p.write_text(s.replace(old, new))
          replace('windows/nix.nix', 'PYTHONPATH = toString ../profile;', 'PYTHONPATH = "${../profile}";')
          replace('flake.nix',
                  'export PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=${./windows}:${./profile}\n          python - <<\'EOF\'\n          import json, os, pack',
                  'export PYTHONDONTWRITEBYTECODE=1\n          python - <<\'EOF\'\n          import sys\n          sys.path[:0] = ["${./windows}", "${./profile}"]\n          import json, os, pack')
          path = 'extensions/release-watch/watch.test.mjs'
          replace(path, "      { path: 'hosts', mode: '040000', type: 'tree', sha: this.hostsTree },",
                  "      { path: 'profile', mode: '040000', type: 'tree', sha: this.profileTree },\n      { path: 'oci', mode: '040000', type: 'tree', sha: this.hostsTree },")
          replace(path, "      { path: 'profile', mode: '040000', type: 'tree', sha: this.profileTree },\n    ];\n    this.profileEntries", "    ];\n    this.profileEntries")
          replace(path, "    const hosts = testGitTreeSha(this.hostsEntries.map((entry) => entry.path === 'profile' ? { ...entry, sha: profile } : entry));\n    return testGitTreeSha(this.rootEntries.map((entry) => entry.path === 'hosts' ? { ...entry, sha: hosts } : entry));",
                  "    return testGitTreeSha(this.rootEntries.map((entry) => entry.path === 'profile' ? { ...entry, sha: profile } : entry));")
          old = '''            before=$(nix eval --raw "git+file://$PWD?rev=$BASE_SOURCE#own-image.drvPath")
                      echo "own image derivation base: $before"
                      echo "rent image derivation base: $(nix eval --raw "git+file://$PWD?rev=$BASE_SOURCE#rent-image.drvPath")"'''
          new = '''            if git cat-file -e "$BASE_SOURCE:flake.nix" 2>/dev/null; then
                        before=$(nix eval --raw "git+file://$PWD?rev=$BASE_SOURCE#own-image.drvPath")
                        rent_before=$(nix eval --raw "git+file://$PWD?rev=$BASE_SOURCE#rent-image.drvPath")
                      else
                        # First migration: read the actual old nested flake's locked Producer.
                        base="git+file://$PWD?dir=nixos&rev=$BASE_SOURCE"
                        before=$(nix eval --raw --expr "(builtins.getFlake \\\"$base\\\").inputs.windows.packages.x86_64-linux.own-image.drvPath")
                        rent_before=$(nix eval --raw --expr "(builtins.getFlake \\\"$base\\\").inputs.windows.packages.x86_64-linux.rent-image.drvPath")
                      fi
                      echo "own image derivation base: $before"
                      echo "rent image derivation base: $rent_before"'''
          replace('.github/workflows/rent-image.yml', old, new)
          PY
          node --test extensions/release-watch/watch.test.mjs
          python3 -m unittest discover -s tests -p test_migration_inventory.py -v
          git diff --check
      - name: Preserve tested source as a candidate commit; remove this one-time transport
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm .github/workflows/migration-reference-fix.yml
          git add windows/nix.nix flake.nix extensions/release-watch/watch.test.mjs .github/workflows/rent-image.yml
          tree=$(git write-tree)
          candidate=$(printf '%s\n' 'fix(migration): retain font closure and reconnect actual tests and baseline' | git commit-tree "$tree" -p HEAD)
          branch="refs/heads/migration/reference-fix-$(git rev-parse --short=12 HEAD)"
          git push origin "$candidate:$branch"
          test "$(git ls-remote --exit-code origin "$branch" | cut -f1)" = "$candidate"
          printf 'candidate=%s\ntree=%s\nbranch=%s\n' "$candidate" "$tree" "$branch" | tee "$RUNNER_TEMP/migration-reference-fix.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-reference-fix
          path: ${{ runner.temp }}/migration-reference-fix.txt
          if-no-files-found: error
