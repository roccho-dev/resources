name: Windows migration source inventory

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - docs/windows-migration.jsonl
      - tests/migration_inventory.py
      - tests/test_migration_inventory.py
      - .github/workflows/windows-migration.yml
  push:
    branches: [proposals]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Finite tests including real disposable Git and refusal cases
        run: python3 -m unittest discover -s tests -p test_migration_inventory.py -v
      - name: Read the single validated source pin
        id: pin
        run: python3 tests/migration_inventory.py metadata docs/windows-migration.jsonl >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: _source
          persist-credentials: false
      - name: Verify pinned preparation source and record newer upstream without admitting it
        env:
          BRANCH: ${{ steps.pin.outputs.branch }}
        run: |
          set -euo pipefail
          remote=$(git -C _source ls-remote --exit-code --heads origin "refs/heads/$BRANCH")
          test "$(printf '%s\n' "$remote" | wc -l)" -eq 1
          read -r observed ref <<< "$remote"
          test "$ref" = "refs/heads/$BRANCH"
          python3 tests/migration_inventory.py inventory docs/windows-migration.jsonl \
            --checkout _source --observed-head "$observed" --preparation \
            --output "$RUNNER_TEMP/windows-path-inventory.jsonl"
          cat "$RUNNER_TEMP/windows-path-inventory.jsonl"
          tail -n 1 "$RUNNER_TEMP/windows-path-inventory.jsonl" >> "$GITHUB_STEP_SUMMARY"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Verify the native resolved lock equals the committed lock
        run: |
          set -euo pipefail
          nix flake metadata --no-write-lock-file --json > "$RUNNER_TEMP/resources-metadata.json"
          python3 - "$RUNNER_TEMP/resources-metadata.json" <<'PYCODE'
          import json, sys
          resolved = json.load(open(sys.argv[1]))["locks"]
          committed = json.load(open("flake.lock"))
          node = resolved["nodes"][resolved["nodes"][resolved["root"]]["inputs"]["host-bindings"]]
          print("NIX_HOST_BINDINGS=" + json.dumps(node, sort_keys=True), flush=True)
          assert node["locked"]["owner"] == "roccho-org" and node["locked"]["repo"] == "envs"
          assert resolved == committed, "flake.lock differs from native resolution; commit the resolved lock before acceptance"
          PYCODE
      - name: Compare pinned fonts, core and retained Binding fields; prove adopted envs bytes
        run: |
          set -euo pipefail
          test "$(git ls-files '*flake.nix')" = flake.nix
          python3 - <<'PYCODE'
          import json
          lock = json.load(open("flake.lock"))
          assert "windows" not in lock["nodes"][lock["root"]]["inputs"]
          assert not any(n.get("locked", {}).get("repo") == "windows" and
                         n.get("locked", {}).get("owner") == "roccho-dev"
                         for n in lock["nodes"].values())
          PYCODE
          old="path:$PWD/_source"
          before=$(nix build "$old#common-fonts" --no-write-lock-file --no-link --print-out-paths)
          after=$(nix build .#common-fonts --no-write-lock-file --no-link --print-out-paths)
          diff -r --no-dereference "$before" "$after"
          test "$(nix eval --raw "$old#own-core.drvPath" --no-write-lock-file)" = \
               "$(nix eval --raw .#own-core.drvPath --no-write-lock-file)"
          bindings=$(nix build .#binding-inputs --no-write-lock-file --no-link --print-out-paths)
          envs=$(nix eval --impure --raw --expr '(builtins.getFlake (toString ./.)).inputs.host-bindings.outPath')
          cmp "$envs/contracts/host-bindings/own/G6I3.json" "$bindings/own.json"
          cmp "$envs/contracts/host-bindings/dev/G6I3.json" "$bindings/dev.json"
          python3 - "$bindings" <<'PYCODE'
          import json, re, sys
          from pathlib import Path

          def compare(old, new, role):
              allowed = {"own": {"image", "imageFrom"}, "dev": {"baseSha", "toolsRev"}}[role]
              # envs' T selection (envs#117): own alone may add exactly the tool/toolFrom pair, absent from the pinned source.
              pair = {"own": {"tool", "toolFrom"}, "dev": set()}[role]
              assert isinstance(new, dict) and set(old) <= set(new) and set(new) - set(old) in (set(), pair) and allowed <= set(new), "Binding fields differ"
              added = set(new) - set(old)
              for key in set(old) - allowed:
                  assert type(old[key]) is type(new[key]) and old[key] == new[key], f"unapproved {role}.{key} change"
              assert all(isinstance(new[k], str) and new[k] for k in allowed | added), "selection must be nonempty text"
              if role == "own":
                  assert re.fullmatch(r"ghcr\.io/roccho-dev/windows-own@sha256:[0-9a-f]{64}", new["image"])
                  assert not added or re.fullmatch(r"/nix/store/[0-9a-z]{32}-own-tool-profile", new["tool"])
              else:
                  assert all(re.fullmatch(r"[0-9a-f]{40}", new[k]) for k in allowed)

          for role, path in (("own", "_source/hosts/own/bindings/G6I3.json"), ("dev", "_source/oci/dev/bindings/G6I3.json")):
              old = json.loads(Path(path).read_text())
              new = json.loads((Path(sys.argv[1]) / f"{role}.json").read_text())
              compare(old, new, role)
              # The same predicate must refuse every missing or type-changed field and an extra field.
              invalid = [{**new, "extra": "unapproved"}]
              for key in new:
                  invalid.extend(({k: v for k, v in new.items() if k != key}, {**new, key: None}))
              if role == "own":
                  # The widened boundary, fixed independently of the adopted bytes: exactly the pair with a store-path
                  # tool is accepted; tool alone, the pair with an unknown key and a non-store tool are refused.
                  base = {k: v for k, v in new.items() if k not in ("tool", "toolFrom")}
                  tool = "/nix/store/" + "a" * 32 + "-own-tool-profile"
                  compare(old, {**base, "tool": tool, "toolFrom": "CI-only T fixture"}, role)
                  invalid.extend(({**base, "tool": tool},
                                  {**base, "tool": tool, "toolFrom": "CI-only T fixture", "extra": "unapproved"},
                                  {**base, "tool": "/tmp/own-tool-profile", "toolFrom": "CI-only T fixture"}))
              for candidate in invalid:
                  try:
                      compare(old, candidate, role)
                  except AssertionError:
                      continue
                  raise AssertionError(f"invalid {role} Binding was accepted")
              print(f"PASS {role}: exact adopted envs bytes; retained fields equal pinned source; {len(invalid)} refusals")
          PYCODE
          echo 'PASS: pinned fonts full contents and own core derivation; adopted envs Binding bytes with only version selections changed or the own tool/toolFrom pair added; root flake has no windows input.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-path-inventory-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/windows-path-inventory.jsonl
          if-no-files-found: error
          retention-days: 7
