name: DSH lock bootstrap (temporary)

on:
  pull_request:
    paths: ['flake.nix', 'flake.lock', '.github/workflows/dsh-lock-bootstrap.yml']

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Resolve the exact declared flake inputs, no credentials
        run: |
          set -euo pipefail
          nix flake lock
          echo 'BEGIN_DSH_LOCK_BASE64'
          base64 -w0 flake.lock
          echo
          echo 'END_DSH_LOCK_BASE64'
