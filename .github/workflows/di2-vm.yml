name: di2 physical-key VM (temporary)

# Temporary: run only the meltype-console VM test on this branch while the cause is found.
# A later commit on the branch deletes this file; own-oci.yml runs the same check in the PR.
on:
  push:
    branches: [test/meltype-console-keys]

permissions:
  contents: read

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Physical-key VM (bcon, meltype-tty, bash)
        run: nix build ./nixos#checks.x86_64-linux.meltype-console-vm --no-write-lock-file --print-build-logs
