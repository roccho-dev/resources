name: DSH Shiguredo (no credentials)
on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - profile/dsh.nix
      - profile/nix.nix
      - nixos/tests/own-oci.nix
      - .github/workflows/dsh-shiguredo.yml
permissions:
  contents: read
jobs:
  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Assert exact fork source and fixed Nix inputs
        run: |
          set -euo pipefail
          jq -e '.nodes["dsh-source"].locked | .owner=="shiguredo" and .repo=="deepseek-harness"' flake.lock
          jq -e '.nodes.root.inputs["dsh-packages"] == null and .nodes["dsh-packages"] == null' flake.lock
          nix flake metadata --no-write-lock-file >/dev/null
      - name: Build only the own tool profile (including fork DSH)
        run: nix build .#own-profile --no-write-lock-file --print-build-logs --out-link "$RUNNER_TEMP/own-profile"
      - name: Confirm real fork CLI and native headless configuration without secrets
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/dsh-user"
          mkdir -m 700 -p "$HOME"
          bin="$RUNNER_TEMP/own-profile/bin"
          "$bin/pi" --version
          "$bin/opencode" --version
          "$bin/dsh" --version
          "$bin/dsh" --profile headless --dump-config > "$RUNNER_TEMP/dsh-effective.yml"
          grep -q "llm-pi-ai" "$RUNNER_TEMP/dsh-effective.yml"
          test -f "$HOME/.dsh/profiles/headless/cordis.patch.yml"
          "$bin/dsh" --profile headless --help >/dev/null
          test ! -e "$HOME/.dsh/.credentials.yaml"
          echo "PASS: shiguredo fork CLI; native profile; Pi and OpenCode preserved; no credentials or API request"
