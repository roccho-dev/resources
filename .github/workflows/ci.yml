name: ci

on:
  pull_request:
  push:
    branches: [proposals]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this tested source as immutable artifacts (no consumer or schedule cutover)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      launcher_only: ${{ steps.scope.outputs.launcher_only }}
      own_tool_only: ${{ steps.scope.outputs.own_tool_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          classify() {
            local path owner=false unrelated=false
            while IFS= read -r path; do
              case "$path" in
                '') ;;
                oci/dev/nix.nix|oci/dev/proof.sh) owner=true ;;
                .github/workflows/ci.yml) ;;
                *) unrelated=true ;;
              esac
            done <<< "$1"
            if [ "$owner" = true ] && [ "$unrelated" = false ]; then echo true; else echo false; fi
          }
          launcher_only=false
          own_tool_only=false
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; then
            [[ $BEFORE =~ ^[0-9a-f]{40}$ && $BEFORE != 0000000000000000000000000000000000000000 ]] || { echo 'RED: missing comparison base' >&2; exit 1; }
            test "$(git rev-parse HEAD)" = "$EXPECTED" || { echo 'RED: source head mismatch' >&2; exit 1; }
            changes=$(git diff --name-only "$BEFORE" "$EXPECTED") || { echo 'RED: changed paths unavailable' >&2; exit 1; }
            launcher_only=$(classify "$changes")
            # A path is only a candidate. The actual before/after B drv must also be identical.
            candidate=true
            while IFS= read -r path; do
              case "$path" in
                profile/releases.json|profile/nix.nix|oci/own/codex.nix|oci/dev/pi.nix) ;;
                *) candidate=false ;;
              esac
            done <<< "$changes"
            if [ "$candidate" = true ] && [ -n "$changes" ]; then
              old_drv=$(nix eval --raw "git+file://$PWD?rev=$BEFORE#own-image.drvPath" --no-write-lock-file)
              new_drv=$(nix eval --raw .#own-image.drvPath --no-write-lock-file)
              if [ "$old_drv" = "$new_drv" ]; then own_tool_only=true; fi
              printf 'own B before %s\nown B after %s\ntool-only %s\n' "$old_drv" "$new_drv" "$own_tool_only" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "launcher_only=$launcher_only" >> "$GITHUB_OUTPUT"
          echo "own_tool_only=$own_tool_only" >> "$GITHUB_OUTPUT"

  # own's T proof and B build/test only; the own image is no longer published (#61 I3).
  own:
    needs: scope
    if: needs.scope.outputs.launcher_only != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/own-image.yml
    with:
      tool_only: ${{ needs.scope.outputs.own_tool_only == 'true' }}

  rent:
    needs: scope
    if: needs.scope.outputs.launcher_only != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/rent-image.yml
    with:
      publish: ${{ github.repository == 'roccho-dev/resources' && ((github.event_name == 'push' && github.ref == 'refs/heads/proposals') || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    secrets: inherit

  dev:
    permissions:
      contents: read
    uses: ./.github/workflows/dev-image.yml

  build:
    needs: scope
    if: needs.scope.outputs.launcher_only != 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source: ${{ steps.source.outputs.sha }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      checksum: ${{ steps.source.outputs.checksum }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check --no-write-lock-file --print-build-logs
      - run: nix build .#windows-dist --no-write-lock-file --print-build-logs
      # T (the own and rent Tool generations) as an exact, rebuildable reference beside B's registry digest: source, flake
      # output, store path and NAR hash. No closure or cache is distributed; a consumer rebuilds the output and compares.
      - name: Describe the own and rent Tool generations (own-tool.json, rent-tool.json)
        run: |
          set -euo pipefail
          nixpkgs=$(nix flake metadata --json --no-write-lock-file | jq -r '.locks.nodes[.locks.nodes.root.inputs.nixpkgs].locked.rev')
          mkdir tool
          # One descriptor form for each role's T; only the role and its flake output differ.
          for pair in own:own-profile rent:rent-tool-profile; do
            role=${pair%%:*} output=packages.x86_64-linux.${pair#*:}
            out=$(nix build ".#${pair#*:}" --no-link --print-out-paths --no-write-lock-file)
            nix store verify "$out"
            nar=$(nix path-info --json "$out" | jq -r 'if type == "array" then .[0].narHash else .[].narHash end')
            jq -n --arg kind "windows.${role}Tool.v1" --arg source "$(git rev-parse HEAD)" --arg output "$output" \
              --arg path "$out" --arg nar "$nar" --arg nixpkgs "$nixpkgs" \
              --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{kind: $kind, source: $source, output: $output,
                storePath: $path, narHash: $nar, nixpkgs: $nixpkgs, run: $run}' > "tool/$role-tool.json"
            valid() {
              jq -e --arg source "$(git rev-parse HEAD)" --arg kind "windows.${role}Tool.v1" --arg output "$output" \
                --arg store "^/nix/store/[0-9a-z]{32}-$role-tool-profile\$" '
                keys == ["kind", "narHash", "nixpkgs", "output", "run", "source", "storePath"] and
                .kind == $kind and .source == $source and .output == $output and
                (.storePath | test($store)) and
                (.narHash | test("^sha256[-:][A-Za-z0-9+/=]+$")) and (.nixpkgs | test("^[0-9a-f]{40}$")) and
                (.run | test("^https://github[.]com/roccho-dev/resources/actions/runs/[0-9]+$"))' "$1" > /dev/null
            }
            valid "tool/$role-tool.json"
            # Each single defect of the descriptor is refused (RED), so the GREEN above is not vacuous.
            for bad in '.kind = "windows.ownImage.v1"' '.extra = 1' 'del(.narHash)' ".storePath = \"/nix/store/x-$role-tool-profile\"" \
                '.source = "0000000000000000000000000000000000000000"' '.nixpkgs = "main"'; do
              jq "$bad" "tool/$role-tool.json" > tool/bad.json
              if valid tool/bad.json; then echo "RED: accepted a $role descriptor with $bad" >&2; exit 1; fi
            done
            rm tool/bad.json
            cat "tool/$role-tool.json" >> "$GITHUB_STEP_SUMMARY"
          done
          # The two roles' descriptors are not interchangeable.
          if (role=rent output=packages.x86_64-linux.rent-tool-profile; valid tool/own-tool.json); then
            echo 'RED: the own descriptor passed as rent' >&2; exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: own-tool
          path: tool/own-tool.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rent-tool
          path: tool/rent-tool.json
          if-no-files-found: error
          retention-days: 7
      - id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "checksum=$(cut -d ' ' -f 1 result/windows-dist.zip.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: windows-dist
          path: |
            result/windows-dist.zip
            result/windows-dist.zip.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    permissions:
      contents: read
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
      - shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.checksum }}
          EXPECTED_SOURCE: ${{ needs.build.outputs.source }}
        run: |
          if ((Get-FileHash windows-dist.zip -Algorithm SHA256).Hash -ne $env:EXPECTED_SHA256) { throw 'Transport checksum mismatch' }
          Expand-Archive windows-dist.zip bundle
          & ./bundle/proof.ps1 -ExpectedSource $env:EXPECTED_SOURCE

  # One Release per source: the proved Windows distribution and rent-image.json, the rent image this same run
  # tested and pushed (by registry digest), so a consumer binds both to the source and runs the image by digest.
  # rent's B-only image and T are described by rent-base-image.json and rent-tool.json (the form of own-tool.json).
  # rent-image.json keeps naming the combined image its consumers run. own's T is own-tool.json; no own image is published.
  publish:
    needs: [scope, build, windows, rent, own, dev]
    if: needs.scope.outputs.launcher_only != 'true' && github.repository == 'roccho-dev/resources' && ((github.event_name == 'push' && github.ref == 'refs/heads/proposals') || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: own-tool
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rent-tool
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ needs.build.outputs.source }}
          EXPECTED_SHA256: ${{ needs.build.outputs.checksum }}
          RENT_IMAGE: ${{ needs.rent.outputs.image }}
          RENT_BASE_IMAGE: ${{ needs.rent.outputs.base_image }}
        run: |
          set -euo pipefail
          test "$SOURCE" = "$GITHUB_SHA"
          printf '%s  windows-dist.zip\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          [[ $RENT_IMAGE =~ ^ghcr\.io/roccho-dev/windows-rent@sha256:[0-9a-f]{64}$ ]] || { echo 'RED: no pushed rent image digest from this run' >&2; exit 1; }
          jq -n --arg source "$SOURCE" --arg image "$RENT_IMAGE" \
            '{kind: "windows.rentImage.v1", source: $source, image: $image}' > rent-image.json
          [[ $RENT_BASE_IMAGE =~ ^ghcr\.io/roccho-dev/windows-rent@sha256:[0-9a-f]{64}$ ]] && [ "$RENT_BASE_IMAGE" != "$RENT_IMAGE" ] ||
            { echo 'RED: no pushed B-only rent image digest from this run' >&2; exit 1; }
          jq -n --arg source "$SOURCE" --arg image "$RENT_BASE_IMAGE" \
            '{kind: "windows.rentBaseImage.v1", source: $source, image: $image}' > rent-base-image.json
          # Read the newly published immutable images as an unauthenticated consumer.
          # No mutable tag, host, credential or existing consumer selection is changed.
          export DOCKER_CONFIG="$RUNNER_TEMP/provider-pull"
          mkdir -p "$DOCKER_CONFIG"
          docker pull "$RENT_IMAGE"
          docker pull "$RENT_BASE_IMAGE"
          jq -e --arg source "$SOURCE" '.kind == "windows.ownTool.v1" and .source == $source' own-tool.json > /dev/null
          jq -e --arg source "$SOURCE" '.kind == "windows.rentTool.v1" and .source == $source' rent-tool.json > /dev/null
          assets=(windows-dist.zip windows-dist.zip.sha256 rent-image.json rent-base-image.json rent-tool.json own-tool.json)
          gh release create "windows-$SOURCE" "${assets[@]}" \
            --target "$SOURCE" --title "Windows $SOURCE" --latest=false \
            --notes "Exact tested artifacts for source $SOURCE; image descriptors use public registry digests. Existing Host/consumer/schedule/state selections are unchanged. Real-host UX, WSLC and Cloudflare acceptance are not claimed."
          # Native release readback: compare the downloaded bytes, not just HTTP success.
          gh release download "windows-$SOURCE" --dir "$RUNNER_TEMP/provider-release"
          for asset in "${assets[@]}"; do cmp "$asset" "$RUNNER_TEMP/provider-release/$asset"; done
          (cd "$RUNNER_TEMP/provider-release" && sha256sum --check --strict windows-dist.zip.sha256)
          unzip -p "$RUNNER_TEMP/provider-release/windows-dist.zip" manifest.json |
            jq -e --arg source "$SOURCE" '.schemaVersion == 3 and .source == $source' >/dev/null
          printf 'PASS provider: source %s; immutable Release and registry images retrieved; no consumer selection changed.\n' "$SOURCE" >> "$GITHUB_STEP_SUMMARY"
