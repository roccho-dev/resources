name: Browser Host proof

on:
  pull_request:
    paths:
      - 'verification/browser-host.nix'
      - '.github/workflows/browser-host-proof.yml'
  push:
    branches: ['docs/nixos-tty-browser-target-615-20261010']
    paths:
      - 'verification/browser-host.nix'
      - '.github/workflows/browser-host-proof.yml'

permissions:
  contents: read

concurrency:
  group: browser-host-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vm-session-smoke:
    name: NixOS VM session smoke — not full acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require actual KVM capability
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m u:"$(id -un)":rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            system-features = nixos-test kvm big-parallel
      - name: Boot NixOS and verify two independent SSH clients
        run: nix-build verification/browser-host.nix --no-out-link --show-trace
      - name: State proof boundary
        if: always()
        run: |
          printf '%s\n' 'This job proves only the VM/session smoke scope.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'bcon rendering, full input, isolation and hardware acceptance remain NOT_PROVEN. This is not an apply gate.' >> "$GITHUB_STEP_SUMMARY"
