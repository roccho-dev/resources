name: Prepare relocated Host source

on:
  pull_request:
    paths:
      - tests/prepare_source.py
      - .github/workflows/migration-prepare.yml

permissions:
  contents: read

concurrency:
  group: migration-prepare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-migration-inventory-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: roccho-dev/windows
          ref: 64fe2fb19c756e3439f3549f9020164e69b91b4f
          path: _windows
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 665eacbbebbf20d31f170ad5b47db0b07f61e3a3
          path: _resources
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Export only tracked source and prepare a new tree
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/old-windows" "$RUNNER_TEMP/old-resources"
          test "$(git -C _windows rev-parse HEAD)" = 64fe2fb19c756e3439f3549f9020164e69b91b4f
          test "$(git -C _resources rev-parse HEAD)" = 665eacbbebbf20d31f170ad5b47db0b07f61e3a3
          git -C _windows archive HEAD | tar -x -C "$RUNNER_TEMP/old-windows"
          git -C _resources archive HEAD | tar -x -C "$RUNNER_TEMP/old-resources"
          python3 tests/prepare_source.py "$RUNNER_TEMP/old-windows" "$RUNNER_TEMP/old-resources" "$RUNNER_TEMP/prepared"
      - name: Generate real lock and evaluate all relocated outputs
        run: |
          set -euo pipefail
          candidate="path:$RUNNER_TEMP/prepared"
          nix flake lock "$candidate"
          # Existing fixed-source imports need realization during evaluation. --no-build
          # makes the store read-only and cannot be the first evaluation in a fresh runner.
          for output in packages checks; do
            nix eval "$candidate#$output.x86_64-linux" --json --no-write-lock-file \
              --apply 'builtins.mapAttrs (_: value: value.drvPath)' > "$RUNNER_TEMP/$output.json"
          done
          nix flake check "$candidate" --no-build --no-write-lock-file --show-trace
          nix flake show "$candidate" --json --no-write-lock-file > "$RUNNER_TEMP/outputs.json"
      - name: Preserve bindings and run the existing Python tests and exact font parity
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          candidate="path:$RUNNER_TEMP/prepared"
          bindings=$(nix build "$candidate#binding-inputs" --no-link --print-out-paths --no-write-lock-file)
          cmp "$RUNNER_TEMP/old-windows/hosts/own/bindings/G6I3.json" "$bindings/own.json"
          cmp "$RUNNER_TEMP/old-windows/oci/dev/bindings/G6I3.json" "$bindings/dev.json"
          py=$(nix build --impure --no-link --print-out-paths --expr "let f = builtins.getFlake \"$candidate\"; p = import f.inputs.nixpkgs { system = \"x86_64-linux\"; }; in p.python3.withPackages (ps: [ ps.fonttools ])")
          PYTHONPATH="$RUNNER_TEMP/prepared/profile" "$py/bin/python3" -m unittest discover -s "$RUNNER_TEMP/prepared/windows" -p 'test_*.py' -v
          PYTHONPATH="$RUNNER_TEMP/prepared/profile" "$py/bin/python3" -m unittest discover -s "$RUNNER_TEMP/prepared/profile" -p 'test_*.py' -v
          old=$(nix build "path:$RUNNER_TEMP/old-windows#common-fonts" --no-link --print-out-paths --no-write-lock-file)
          new=$(nix build "$candidate#common-fonts" --no-link --print-out-paths --no-write-lock-file)
          diff -r --no-dereference "$old" "$new"
          nix build "$candidate#checks.x86_64-linux.own-composition" --no-link --no-write-lock-file --print-build-logs
          printf '%s\n' 'PASS evaluated outputs, byte-identical public bindings, original Python tests, exact font parity and real own composition' >> "$GITHUB_STEP_SUMMARY"
      - name: Store prepared objects under an inert prefix on a candidate branch only
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$RUNNER_TEMP/prepared-index"
          git read-tree HEAD
          python3 - <<'PY'
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prepared'
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              assert not path.is_symlink() and '__pycache__' not in path.parts
              sha = subprocess.check_output(['git', 'hash-object', '-w', str(path)], text=True).strip()
              mode = '100755' if path.stat().st_mode & 0o111 else '100644'
              name = '.migration/prepared/' + path.relative_to(root).as_posix()
              subprocess.run(['git', 'update-index', '--add', '--cacheinfo', mode, sha, name], check=True)
          PY
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'chore(migration): retain validated relocated source under inert prefix' | git commit-tree "$tree" -p HEAD)
          branch="refs/heads/migration/prepared-$(git rev-parse --short=12 HEAD)"
          git push origin "$commit:$branch"
          test "$(git ls-remote --exit-code --heads origin "$branch" | cut -f1)" = "$commit"
          printf 'commit=%s\nbranch=%s\nprepared_tree=%s\n' "$commit" "$branch" "$(git rev-parse "$commit:.migration/prepared")" | tee "$RUNNER_TEMP/prepared-result.txt"
      - name: Preserve generated source for inspection even when evaluation fails
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/prepared" ]; then tar -cf "$RUNNER_TEMP/prepared-source.tar" -C "$RUNNER_TEMP/prepared" .; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prepared-host-source
          path: |
            ${{ runner.temp }}/prepared-source.tar
            ${{ runner.temp }}/prepared-result.txt
            ${{ runner.temp }}/outputs.json
            ${{ runner.temp }}/packages.json
            ${{ runner.temp }}/checks.json
          if-no-files-found: error
          retention-days: 7
