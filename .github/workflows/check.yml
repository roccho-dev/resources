name: check

on:
  pull_request:
    paths: ['nixos/**', '.github/workflows/check.yml']
  push:
    branches: [proposals]
    paths: ['nixos/**', '.github/workflows/check.yml']

permissions:
  contents: read

jobs:
  nixos-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Evaluate and build source checks without credentials
        run: nix flake check ./nixos --no-write-lock-file --print-build-logs
